name: Auto-Deploy to Oracle Cloud

on:
  push:
    branches:
      - claude/trading-bot-setup-qb6687
    # The bot pushes these itself (journal sync, hourly heartbeat). Ignoring
    # them stops the bot from redeploying/restarting itself every hour.
    paths-ignore:
      - "logs/**"
      - "status.json"

jobs:
  # ── Gate 1: tests must pass before anything touches the server ──────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run test suite
        run: python -m pytest tests/ -v

  # ── Gate 2: deploy only runs if the test job succeeded ──────────────────────
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 132.226.218.49
          username: ubuntu
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          port: 22
          script_stop: true   # fail the step loudly if ANY command errors
          script: |
            set -e
            cd ~/TradingBot

            # The bot's live logs (journal, equity history) are the source of
            # truth. They are tracked on the branch via API sync, so a plain
            # `git reset --hard` would overwrite the server's newer copies with
            # the last-synced version and lose intraday data. Back them up and
            # restore the server's versions after the reset.
            mkdir -p /tmp/tb_logs && cp logs/*.csv /tmp/tb_logs/ 2>/dev/null || true

            # Force the working tree to exactly match the remote branch
            # (conflict-proof; a plain pull aborts on the locally-modified logs).
            git fetch origin claude/trading-bot-setup-qb6687
            git reset --hard origin/claude/trading-bot-setup-qb6687
            echo "Now on commit: $(git rev-parse --short HEAD)"

            # Restore the server's live logs (they win over the reset version)
            cp /tmp/tb_logs/*.csv logs/ 2>/dev/null || true

            # Inject GITHUB_TOKEN into .env if secret is configured
            if [ -n "${{ secrets.BOT_GITHUB_TOKEN }}" ]; then
              if grep -q "^GITHUB_TOKEN=" .env 2>/dev/null; then
                sed -i "s|^GITHUB_TOKEN=.*|GITHUB_TOKEN=${{ secrets.BOT_GITHUB_TOKEN }}|" .env
              else
                echo "GITHUB_TOKEN=${{ secrets.BOT_GITHUB_TOKEN }}" >> .env
              fi
            fi

            sudo systemctl restart tradingbot
            echo "Deploy successful: $(date)"
