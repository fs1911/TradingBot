name: Auto-Deploy to Oracle Cloud

on:
  push:
    branches:
      - claude/trading-bot-setup-qb6687

jobs:
  # ── Gate 1: tests must pass before anything touches the server ──────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: python -m pytest tests/ -v

  # ── Gate 2: deploy only runs if the test job succeeded ──────────────────────
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 132.226.218.49
          username: ubuntu
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          port: 22
          script: |
            cd ~/TradingBot
            git pull origin claude/trading-bot-setup-qb6687

            # Inject GITHUB_TOKEN into .env if secret is configured
            if [ -n "${{ secrets.BOT_GITHUB_TOKEN }}" ]; then
              if grep -q "^GITHUB_TOKEN=" .env 2>/dev/null; then
                sed -i "s|^GITHUB_TOKEN=.*|GITHUB_TOKEN=${{ secrets.BOT_GITHUB_TOKEN }}|" .env
              else
                echo "GITHUB_TOKEN=${{ secrets.BOT_GITHUB_TOKEN }}" >> .env
              fi
            fi

            sudo systemctl restart tradingbot
            echo "Deploy successful: $(date)"
