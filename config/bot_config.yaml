# ============================================================
# TradingBot — Core Bot Configuration
# ============================================================

bot:
  name: "TradingBot-CH"
  version: "1.3.0"
  environment: "paper"
  trading_enabled: true
  loop_interval_seconds: 60
  max_hold_hours: 6        # Auto-close any position after 6 hours (time-based exit)
  sl_cooldown_minutes: 30  # No re-entry on same symbol for 30 min after stop-loss

broker: "alpaca"

active_strategies:
  - "macd_momentum"
  - "vwap_reversion"
  - "supertrend"
  - "breakout_momentum"
  # Disabled: ema_crossover (15% WR, -$241) and bollinger_bounce (33% WR, -$649)
  # Re-enable after AutoTuner has optimised their parameters

# Crypto-only: mean reversion creates too many false signals on 24/7 volatile markets
crypto_strategies:
  - "supertrend"
  - "breakout_momentum"

markets:
  alpaca:
    symbols: [
      "SPY", "QQQ", "AAPL", "MSFT", "NVDA", "AMZN", "TSLA", "META", "AMD", "GOOGL",
      "NFLX", "INTC", "CRM", "DIS", "BABA",
      "COIN", "PLTR", "UBER", "PYPL", "SOFI", "HOOD", "NIO", "RIVN",
      "JPM", "V", "WMT", "JNJ",
      "GLD", "IWM", "SLV", "USO", "TLT", "XLE", "XLF",
      "XLK", "XLY", "XLV", "GDX", "ARKK", "EEM",
      "BTC/USD", "ETH/USD", "SOL/USD", "DOGE/USD",
      "LINK/USD", "AVAX/USD", "LTC/USD", "BCH/USD", "MATIC/USD"
    ]
    timeframe: "15Min"

  binance:
    symbols: ["BTC/USDT", "ETH/USDT", "SOL/USDT"]
    timeframe: "1h"

  kraken:
    symbols: ["XBT/USD", "ETH/USD"]
    timeframe: "60"

sessions:
  forex_london:
    start: "07:00"
    end: "16:00"
  forex_new_york:
    start: "13:00"
    end: "22:00"
  us_stocks:
    start: "13:30"
    end: "20:00"
  crypto:
    start: "00:00"
    end: "23:59"

watchdog:
  max_consecutive_losses: 5
  safe_mode_on_daily_drawdown_pct: 3.0
  resume_after_hours: 24
