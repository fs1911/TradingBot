# ============================================================
# TradingBot — Core Bot Configuration
# ============================================================

bot:
  name: "TradingBot-CH"
  version: "1.4.0"
  environment: "paper"
  trading_enabled: true
  loop_interval_seconds: 60
  max_hold_hours: 24       # Let trends develop — 6h cut winners short (see results analysis)
  sl_cooldown_minutes: 30  # No re-entry on same symbol for 30 min after stop-loss

broker: "alpaca"

active_strategies:
  - "macd_momentum"
  - "vwap_reversion"
  - "supertrend"
  - "breakout_momentum"
  # --- Experiment: ICT / session day-trading setups (paper only, learning) ---
  - "london_orb"
  - "newyork_orb"
  - "judas_swing"
  - "silver_bullet"
  # Disabled: ema_crossover (15% WR, -$241) and bollinger_bounce (33% WR, -$649)

# Which strategies may fire on crypto (24/7). The session setups are included
# for the experiment even though crypto has no true London/NY open.
crypto_strategies:
  - "supertrend"
  - "breakout_momentum"
  - "london_orb"
  - "newyork_orb"
  - "judas_swing"
  - "silver_bullet"

markets:
  alpaca:
    symbols: [
      # US large-cap / tech
      "SPY", "QQQ", "AAPL", "MSFT", "NVDA", "AMZN", "TSLA", "META", "AMD", "GOOGL",
      "NFLX", "INTC", "CRM", "DIS", "BABA", "ORCL", "ADBE", "AVGO", "QCOM", "TXN",
      "CSCO", "PEP", "KO", "MCD", "NKE", "SBUX", "COST", "TMUS", "CMCSA", "PYPL",
      # High-beta / retail favourites
      "COIN", "PLTR", "UBER", "SOFI", "HOOD", "NIO", "RIVN", "LCID", "MARA", "RIOT",
      "SNAP", "SHOP", "SQ", "ROKU", "DKNG", "AFRM", "PINS", "F", "GM", "T",
      # Financials / healthcare / staples
      "JPM", "BAC", "WFC", "GS", "MS", "V", "MA", "WMT", "JNJ", "PFE", "UNH", "XOM", "CVX",
      # ETFs / sectors / commodities
      "GLD", "IWM", "SLV", "USO", "TLT", "XLE", "XLF", "XLK", "XLY", "XLV",
      "GDX", "ARKK", "EEM", "DIA", "SMH", "XBI", "XLI", "XLP",
      # Crypto (24/7)
      "BTC/USD", "ETH/USD", "SOL/USD", "DOGE/USD", "LINK/USD", "AVAX/USD",
      "LTC/USD", "BCH/USD", "UNI/USD", "AAVE/USD", "XRP/USD", "DOT/USD",
      "SHIB/USD", "XTZ/USD", "GRT/USD"
    ]
    timeframe: "5Min"   # finer bars for the intraday/ORB experiment (was 15Min)

  binance:
    symbols: ["BTC/USDT", "ETH/USDT", "SOL/USDT"]
    timeframe: "1h"

  kraken:
    symbols: ["XBT/USD", "ETH/USD"]
    timeframe: "60"

sessions:
  forex_london:
    start: "07:00"
    end: "16:00"
  forex_new_york:
    start: "13:00"
    end: "22:00"
  us_stocks:
    start: "13:30"
    end: "20:00"
  crypto:
    start: "00:00"
    end: "23:59"

watchdog:
  max_consecutive_losses: 5
  safe_mode_on_daily_drawdown_pct: 3.0
  resume_after_hours: 24
