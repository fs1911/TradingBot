  symbols: ["SPY", "QQQ", "IWM", "XLK"]   # regime-conditional mean reversion

experiment16:
  volume_symbols: ["SPY", "QQQ", "IWM", "BTC/USD"]   # volume capitulation + OBV trend
  dual_momentum: {risk: "SPY", bond: "TLT"}          # stocks-vs-bonds defensive rotation

experiment15:
