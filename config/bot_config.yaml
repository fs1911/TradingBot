# ============================================================
# TradingBot — Core Bot Configuration
# ============================================================

bot:
  name: "TradingBot-CH"
  version: "1.5.0"
  environment: "paper"
  trading_enabled: true
  loop_interval_seconds: 60
  max_hold_hours: 24       # Let trends develop — 6h cut winners short (see results analysis)
  sl_cooldown_minutes: 30  # No re-entry on same symbol for 30 min after stop-loss
  min_hold_seconds: 120    # Ghost-trade guard: a position can't be closed for 120s after opening
  run_backtest_on_start: false  # Grouped edge test done (2026-08-14): no edge in any asset class
  run_trend_backtest_on_start: false  # Daily trend test done (2026-08-14); see trend_backtest_results.md
  run_benchmark_on_start: false  # Benchmark done (2026-08-14); see benchmark_results.md
  run_walkforward_on_start: false  # Walk-forward done (2026-08-14): metals edge NOT robust (beat hold 1/19 windows)
  run_xsec_on_start: false  # XSec momentum done (2026-08-29): not robust (equities 6/18, crypto 3/17 windows)
  run_rotation_on_start: false  # BTC/Gold/Dollar done (2026-08-29): not robust (beat holds 3/19 windows)

# Small deliberate baskets for the rotation edge test (backtest only, not auto-traded).
rotation_baskets:
  BTC_Gold_Dollar:
    symbols: ["BTC/USD", "GLD", "UUP"]   # bitcoin, gold, US-dollar index ETF
    cash: "UUP"                           # defensive leg for dual-momentum

broker: "alpaca"

active_strategies:
  - "macd_momentum"
  - "vwap_reversion"
  - "supertrend"
  - "breakout_momentum"
  # ROLLED BACK 2026-07-27: the ICT/session experiment (london_orb, newyork_orb,
  # judas_swing, silver_bullet) on 5-min bars lost ~21% in a week with a large
  # unexplained (likely unrealized) drawdown. Code kept but deactivated.
  # Disabled: ema_crossover (15% WR, -$241) and bollinger_bounce (33% WR, -$649)

# Crypto-only: mean reversion creates too many false signals on 24/7 volatile markets
crypto_strategies:
  - "supertrend"
  - "breakout_momentum"

markets:
  alpaca:
    symbols: [
      "SPY", "QQQ", "AAPL", "MSFT", "NVDA", "AMZN", "TSLA", "META", "AMD", "GOOGL",
      "NFLX", "INTC", "CRM", "DIS", "BABA",
      "COIN", "PLTR", "UBER", "PYPL", "SOFI", "HOOD", "NIO", "RIVN",
      "JPM", "V", "WMT", "JNJ",
      "GLD", "IWM", "SLV", "USO", "TLT", "XLE", "XLF",
      "XLK", "XLY", "XLV", "GDX", "ARKK", "EEM",
      "PPLT", "PALL", "CPER", "LIT", "UNG", "DBC",  # Platin, Palladium, Kupfer, Lithium, Erdgas, breite Rohstoffe
      "BTC/USD", "ETH/USD", "SOL/USD", "DOGE/USD",
      "LINK/USD", "AVAX/USD", "LTC/USD", "BCH/USD", "MATIC/USD"
    ]
    timeframe: "15Min"   # rolled back from 5Min (2026-07-27 experiment)

  binance:
    symbols: ["BTC/USDT", "ETH/USDT", "SOL/USDT"]
    timeframe: "1h"

  kraken:
    symbols: ["XBT/USD", "ETH/USD"]
    timeframe: "60"

sessions:
  forex_london:
    start: "07:00"
    end: "16:00"
  forex_new_york:
    start: "13:00"
    end: "22:00"
  us_stocks:
    start: "13:30"
    end: "20:00"
  crypto:
    start: "00:00"
    end: "23:59"

# Backtest-only universes for the grouped OOS edge test (_run_startup_backtest).
# These are NOT auto-traded — an asset class only earns live trading if a
# strategy's edge SURVIVES out-of-sample here first. Platinum/lithium have no
# direct Alpaca instrument, so standard ETFs are used as proxies.
backtest_universes:
  equities:   ["SPY", "QQQ", "AAPL", "MSFT", "NVDA", "AMZN", "TSLA", "META", "GOOGL", "JPM", "V", "WMT", "COIN", "PLTR"]
  metals:     ["GLD", "SLV", "GDX", "PPLT", "PALL", "CPER", "LIT"]   # gold, silver, miners, platinum, palladium, copper, lithium
  energy:     ["USO", "UNG", "XLE", "DBC"]                            # oil, natural gas, energy sector, broad commodities
  crypto:     ["BTC/USD", "ETH/USD", "SOL/USD", "DOGE/USD", "LINK/USD", "AVAX/USD", "LTC/USD", "BCH/USD"]

watchdog:
  max_consecutive_losses: 5
  safe_mode_on_daily_drawdown_pct: 3.0
  resume_after_hours: 24
