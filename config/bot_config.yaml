# Backtest-only universes for the grouped OOS edge test (_run_startup_backtest).
# These are NOT auto-traded — an asset class only earns live trading if a
# strategy's edge SURVIVES out-of-sample here first. Platinum/lithium have no
# direct Alpaca instrument, so standard ETFs are used as proxies.
backtest_universes:
  equities:   ["SPY", "QQQ", "AAPL", "MSFT", "NVDA", "AMZN", "TSLA", "META", "GOOGL", "JPM", "V", "WMT", "COIN", "PLTR"]
  metals:     ["GLD", "SLV", "GDX", "PPLT", "PALL", "CPER", "LIT"]   # gold, silver, miners, platinum, palladium, copper, lithium
  energy:     ["USO", "UNG", "XLE", "DBC"]                            # oil, natural gas, energy sector, broad commodities
  crypto:     ["BTC/USD", "ETH/USD", "SOL/USD", "DOGE/USD", "LINK/USD", "AVAX/USD", "LTC/USD", "BCH/USD"]

watchdog:
  max_consecutive_losses: 5
  safe_mode_on_daily_drawdown_pct: 3.0
  resume_after_hours: 24
