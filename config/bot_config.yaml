# ============================================================
# TradingBot — Core Bot Configuration
# ============================================================

bot:
  name: "TradingBot-CH"
  version: "1.5.0"
  environment: "paper"
  trading_enabled: true
  loop_interval_seconds: 60
  max_hold_hours: 24       # Let trends develop — 6h cut winners short (see results analysis)
  sl_cooldown_minutes: 30  # No re-entry on same symbol for 30 min after stop-loss
  min_hold_seconds: 120    # Ghost-trade guard: a position can't be closed for 120s after opening
  run_backtest_on_start: false  # Grouped edge test done (2026-08-14): no edge in any asset class
  run_trend_backtest_on_start: false  # Daily trend test done (2026-08-14); see trend_backtest_results.md
  run_benchmark_on_start: false  # Benchmark done (2026-08-14); see benchmark_results.md
  run_walkforward_on_start: false  # Walk-forward done (2026-08-14): metals edge NOT robust (beat hold 1/19 windows)
  run_xsec_on_start: false  # XSec momentum done (2026-08-29): not robust (equities 6/18, crypto 3/17 windows)
  run_rotation_on_start: false  # BTC/Gold/Dollar done (2026-08-29): not robust (beat holds 3/19 windows)
  run_vol_premium_on_start: false  # Vol premium done (2026-08-29): real but loses to SPY (MAR 1.24 vs 7.22), 5/21 windows
  run_quant_on_start: false  # Quant research done (2026-09-19): pairs stat-arb PASSED walk-forward 8/12 (67%) — needs cost stress-test
  run_pairs_stress_on_start: false  # Stress-test done (2026-09-19): edge did NOT survive — 33% walk-fwd, rests on 1 pair, dies at realistic costs
  run_ratio_research_on_start: false  # Exp #9 done (2026-09-19): GLD/GDX survives at low/base costs (67-76% WF), marginal at realistic — needs param-robustness test
  run_experiment10_on_start: false  # Exp #10 done (2026-09-19): GLD/GDX OVERFIT (5/27 combos at realistic costs); dollar ratios no edge
  run_experiment11_on_start: false  # Exp #11 done (2026-09-19): 0/10 survive the strong battery (significance + haircut + regime)
  run_experiment12_on_start: false  # Exp #12 done (2026-09-20): RSI2 SPY & QQQ SURVIVE full battery (p=0.001, WF 76-81%, 3/3 regimes) — needs param-robustness (exp #13)
  run_experiment13_on_start: false  # Exp #13 done (2026-09-20): RSI(2) real but fragile — sign consistent across grid, but only 2-4/24 combos pass strict significance at realistic costs; 0 on DIA/XLF
  run_experiment14_on_start: false  # Exp #14 done (2026-09-20): vol-targeting cuts drawdowns ~half but doesn't add return (0/6 better MAR) — risk mgmt, not edge. AGENDA COMPLETE.
  run_experiment15_on_start: false  # Exp #15 done (2026-09-21): ML 0/6 survive; model rediscovered the same weak mean-reversion signal (neg weight on rsi2/d_sma20), confirms no tradeable edge
  run_experiment16_on_start: false  # Exp #16 done (2026-09-21): 0/9 — volume signals & SPY/TLT dual momentum add no significant edge (OBV/dual-mom positive but fail haircut)
  run_experiment17_on_start: false  # Exp #17 done (2026-09-21): 1/8 "survives" (RSI2-lowvol SPY) but it's a multiple-testing artifact — contradicts the pre-registered high-vol hypothesis, 1 of 4 indices, p=0.001 barely under α/45. Rejected.
  run_experiment18_on_start: false  # Exp #18 done (2026-09-21): intraday MR LOSES significantly (t=-2 to -5) on bar level; free feed only ~70 days → real intraday research needs paid multi-year data
  run_experiment19_on_start: false  # Exp #19 done (2026-09-21): 0/55 survive. Mean-reversion lives ONLY in large-cap US equity indices/sectors (⚠️); metals/commodities/currencies/bonds/crypto = random walk, no edge
  run_experiment20_on_start: false  # Exp #20 done (2026-09-22): 0/6 survive on 92 stocks. Reversal negative even @1bps and killed by costs (t→-3.7); 12-1 momentum has the project's only positive Sharpe (0.44, 2/3 regimes+) but p≈0.15, not significant, OOS negative. No tradeable edge even on survivor-biased universe
  run_experiment21_on_start: false  # Exp #21 done (2026-09-22): 0/6 survive. Market-neutral variants cluster Sharpe 0.27-0.43, none significant, refinements add nothing. Long-only top decile is strongest ever (Sharpe 0.72, +106% OOS, 3/3 regimes) but fails haircut+walk-forward — suspected BETA not alpha; test vs benchmark in #22
  run_experiment22_on_start: false  # Exp #22 done (2026-09-22): 0/5 — clearly BETA. Equal-weight-universe benchmark Sharpe=1.03 BEATS every momentum selection (0.61-0.78); alpha Sharpes ~0, none significant. Momentum has zero selection alpha, was worse than holding all names equally. Strongest project result dissolves; only Sharpe>1 is survivor-biased beta+diversification
  run_experiment23_on_start: false  # Exp #23 done (2026-09-22): 0/4, premium NEGATIVE (Sharpe -0.25 to -0.29, OOS -11%, p~0.73). B&H 0.96 ≈ rebalanced 0.94-0.95, frequency irrelevant. In a trending bull market letting winners run beats trimming → rebalancing is risk-control, not an edge. Last structural mechanism mapped
  run_experiment24_on_start: false  # Exp #24 done (2026-09-22, ~1400d Bybit): FIRST SURVIVOR. BTC/ETH/DOGE ✅ (Sharpe ~7), basket@0% Sharpe 9.25 (100% wf, 3/3 regimes). BUT gross return only ~8%/yr, cost-fragile (dies @5%/yr, marginal @2%), funding negative 17-27% of time, battery can't see counterparty/liquidation/basis risk, not tradeable on Alpaca. Real but thin → net-cost study in #25

  run_experiment25_on_start: false  # Exp #25 done (2026-09-22): gross ~7.9%/yr. NET turnover-sensitive: 7d taker = -4.4% (loss); rare rotation wins (90d maker +7.3%, 90d taker +6.2%, 30d maker +6.7%). 10 CHF/day needs ~50-83k CHF capital. Real & net-positive only with low-turnover/maker execution, but just 1-3pp over risk-free cash; unpriced tail risks plausibly eat that margin
  run_experiment26_on_start: false  # Exp #26 done (2026-09-22, 23 perps): 3/3 survive. Breadth DILUTES return (broad basket 5.8%/yr). Carry-weighted tilt WINS: 8.6%/yr Sharpe 11.15 100% wf. Spread 6.3%/yr Sharpe 14.78 but more legs/cost. Edge confirmed & modestly improvable (~8.6% gross) but still cash-plus & cost-fragile — no order-of-magnitude breakthrough
  run_experiment27_on_start: false  # Exp #27 done (2026-09-22, 2 venues): statistically ✅ but economically trivial. Combined only ~1.55%/yr gross (Sharpe 5.53, 100% wf) — survives battery but too thin (<3%/yr); after two-venue fees/transfers/dual-liquidation it's no edge. Funding is highly correlated across venues. Level carry (#24-26 tilt ~8.6%) stays the only worthwhile version
  run_experiment28_on_start: false  # Exp #28 DEFERRED (2026-09-22): unbounded dated-futures fetch hung the bot & jammed deploys. Now bounded (16 contracts + 15s ccxt timeout) but disabled on-start to keep restarts safe; re-enable manually once trusted. Dated-contract history is likely unavailable anyway (data boundary)

  run_experiment29_on_start: false  # Exp #29 done (2026-09-22): NEGATIVE. Funding is NOT a contrarian froth predictor — contrarian in only 1/6 coins (BNB), in 5/6 high funding preceded HIGHER returns (funding runs with momentum). 'Step aside when hot' filter beats buy&hold in 0/6. No usable Finanzradar rule from funding
  run_experiment30_on_start: false  # Exp #30 done (2026-09-23): PARTIAL POSITIVE, best Finanzradar find. Drawdown-from-ATH contrarian in 4/6 (BTC/ETH very strong). Pooled: DD<=-35% -> +14%/90d, -35..-10% -> +2.4%, near-ATH -> +4.3%. Usable = DEEP-drawdown buy signal only; 'near-ATH=overheated' does NOT hold; 200d-MA gauge weak (3/6). Conditioned on assets that recover

  run_experiment31_on_start: false  # Exp #31 done (2026-09-24): #30 signal NOT robust — zone reached 7/13 in 6y, excess positive 6/7 but t>2 in 0/7, both halves 2/7, ~15 episodes mostly 2022. Dip-reserve beats DCA only 5/13 (cash drag). Needs decades of data

  run_experiment32_on_start: false  # Exp #32 done (2026-09-24, Yahoo 17-57y): drawdown BUY signal refuted (-35%: excess 5/9, t>2 2/9; Nasdaq/Nikkei/Gold/BTC negative); dip-reserve beats DCA 0/9. SMA200 filter cuts max drawdown 9/9, Sharpe 6/9, but lower CAGR, 0/9 beat B&H — risk tool, not alpha

  run_experiment33_on_start: false  # Exp #33 done (2026-09-25): with T-bill cash + dividends SMA200 cuts max DD 8/8, Sharpe better 7/8, robust across 150/200/250/monthly (6/8), but CAGR higher only 2/8 (Nasdaq, Nikkei), rigor 0/8. Trend-DCA full halves DD 8/8 but more wealth only 3/8 (DAX/SMI/Nikkei); light ~= plain DCA. Insurance, not alpha

  run_experiment34_on_start: false  # Exp #34 done (2026-09-25, Shiller 1881-2023): CAPE predicts real returns consistently (10y cheapest +10.9%/y vs dearest +3.0%/y, sign stable pre/post 1950) but only borderline significant (n=14 at 10y) and NOT tradeable: CAPE-scaled allocation 5.0% vs 6.65% real. Trend filter 8.8% vs 6.65% real but on monthly-average prices (Working-effect bias) -> verify in #35
  run_experiment35_on_start: false  # Exp #35 done (2026-09-25): #34 trend edge ~2/3 averaging artefact (autocorr +0.27 vs +0.08). True month-end: +0.65pp/y (p=0.56), 0% cash -1.8pp, 1928-49 -2.8pp. Drawdown reduction survives in all eras. Insurance, not alpha
  run_experiment36_on_start: false  # Exp #36 done (2026-09-25): calendar anomalies vanish after publication — pre: TOM t+6.3, monday t-6.1, pre-holiday t+6.4; post: 0/5 significant, effect 2-34% left, last 20y ~0. TOM-only strategy since 2007 +0.9%/y
  run_experiment37_on_start: false  # Exp #37 done (2026-09-25): VRP real & persistent — VIX-realised +4.0pts, 84% months, t+12.6; 81% retained after 2003 publication (vs 2-34% for #36 anomalies). PutWrite Sharpe 0.84 vs 0.73, maxDD -33 vs -51%, alpha +2.3%/y t2.2 (not after haircut), skew -1.7. SVXY -94% (Feb 2018)
  run_experiment38_on_start: false  # Exp #38 done (2026-09-25): PutWrite+trend daily Sharpe 0.98 (S&P TR 0.58), maxDD -16% vs -55%, crash tail removed (dot-com +5%, GFC -1%), but CAGR 7.0% vs 9.8%; rigor 0/4 on return differentials. Risk-adjusted best of project; needs Sharpe-difference + equal-risk test
  run_experiment39_on_start: false  # Exp #39 done (2026-09-25): excess Sharpe 0.66 vs 0.45, bootstrap p=0.09 (CI incl. 0), 0/3 after haircut. 2x lev 10.1% vs 9.4% (DD -31 vs -55%), equal-vol 11.9% but gap/margin risk. Robust 15/24; start 2012 0/6. Plausible, not proven

