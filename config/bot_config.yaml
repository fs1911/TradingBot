experiment14:
  symbols: ["SPY", "QQQ", "IWM", "GLD", "BTC/USD", "ETH/USD"]   # vol-targeting vs buy-and-hold

experiment13:
  symbols: ["SPY", "QQQ", "DIA", "XLK", "XLF"]   # test the RSI(2) survivor across liquid indices/sectors

# Experiment #12: documented anomalies
experiment12:
  index_symbols: ["SPY", "QQQ", "IWM"]     # turn-of-month, overnight, RSI(2)
  lowvol_universe: ["XLF", "XLK", "XLE", "XLY", "XLV", "XLI", "XLP", "XLU", "SPY", "QQQ"]

# Experiment #11: economically-grounded calendar / cross-asset effects
experiment11:
  seasonality_symbols: ["UNG", "USO", "XLE", "GLD", "SPY"]   # nat-gas/oil/energy seasonality
  lead_lag_pairs:
    - {leader: "CPER", target: "SPY"}     # Dr. Copper leads equities?
    - {leader: "CPER", target: "XLI"}     # copper leads industrials?
    - {leader: "HG=F", target: "SPY"}     # (skipped if unavailable)
  term_structure: {front: "VXX", back: "VIXM", trade: "SVXY"}  # VIX contango -> short vol
  weekday_symbols: ["BTC/USD", "ETH/USD"]  # crypto day-of-week effect

# Experiment #10 config
param_robust_pair: {a: "GLD", b: "GDX"}   # candidate to stress across the parameter grid
usd_ratio_experiments:                     # commodity vs USD *strength* (dollar-index ETF UUP)
  - {a: "GLD",  b: "UUP"}    # gold vs dollar strength
  - {a: "SLV",  b: "UUP"}    # silver vs dollar strength
  - {a: "USO",  b: "UUP"}    # oil vs dollar strength
  - {a: "GDX",  b: "UUP"}    # gold-miners vs dollar strength

# Experiment #9: economically-linked commodity ratios (real supply/demand coupling).
ratio_experiments:
  - {a: "GLD",  b: "SLV"}    # gold / silver ratio (classic)
  - {a: "PPLT", b: "PALL"}   # platinum / palladium
  - {a: "GLD",  b: "USO"}    # gold / oil
  - {a: "GLD",  b: "GDX"}    # gold / gold-miners
  - {a: "SLV",  b: "GDX"}    # silver / miners

