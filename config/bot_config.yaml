  banks:   ["JPM", "BAC", "C", "WFC", "GS", "MS"]
  bigtech: ["AAPL", "MSFT", "GOOGL", "META", "NVDA", "AMD"]
  metals:  ["GLD", "SLV", "GDX", "PPLT", "PALL"]
  crypto:  ["BTC/USD", "ETH/USD", "SOL/USD", "LTC/USD", "BCH/USD"]

# Universe for the quant-research / pairs scan (backtest only). A rich cross-section
