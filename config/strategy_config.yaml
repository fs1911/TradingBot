# ============================================================
# TradingBot — Strategy Parameters
# ============================================================

ema_crossover:
  fast_ema: 9
  slow_ema: 21
  volume_filter: false
  volume_multiplier: 1.0
  atr_period: 14
  sl_atr_multiplier: 2.0
  tp_atr_multiplier: 3.0
  trailing_stop: true
  trailing_stop_atr: 1.2
  confirmation_candles: 1
  crossover_lookback: 3
  adx_min: 18             # Only trade when trend is strong enough

rsi_mean_reversion:
  rsi_period: 14
  oversold_threshold: 32
  overbought_threshold: 68
  extreme_oversold: 22
  extreme_overbought: 78
  ema_trend_filter: 50
  stoch_confirmation: true
  stoch_oversold: 28
  stoch_overbought: 72
  require_body_direction: true
  adx_max: 28             # Only trade in ranging markets (ADX < 28)
  atr_period: 14
  sl_atr_multiplier: 1.8
  tp_atr_multiplier: 3.5

macd_momentum:
  fast_period: 12
  slow_period: 26
  signal_period: 9
  histogram_threshold: 0.0
  ema_trend_filter: 50
  adx_min: 18             # Skip flat-market crossovers — some trend momentum required
  atr_period: 14
  sl_atr_multiplier: 2.0
  tp_atr_multiplier: 4.0
  min_histogram_magnitude: 0.001

bollinger_bounce:
  atr_period: 14
  sl_atr_multiplier: 2.0
  tp_atr_multiplier: 3.5
  rsi_long_max: 50
  rsi_short_min: 50
  adx_max: 30             # Avoid strong trends — only bounce in ranging markets

vwap_reversion:
  vwap_deviation_pct: 0.5
  reentry_tolerance_pct: 0.1
  adx_max: 28             # Mean-reversion: only trade in ranging markets, never fight a strong trend
  atr_period: 14
  sl_atr_multiplier: 1.8
  tp_atr_multiplier: 3.0
  rsi_long_max: 55
  rsi_short_min: 45

supertrend:
  atr_period: 10
  multiplier: 3.0
  sl_atr_multiplier: 2.0
  tp_atr_multiplier: 5.0  # Let winners run — trend trades need room
  adx_min: 25             # Stricter: only confirmed strong trends (better for crypto volatility)

breakout_momentum:
  breakout_lookback: 20   # Break above/below the 20-bar high/low
  volume_multiplier: 1.4  # Volume must be 1.4x the average
  ema_trend_filter: 50    # Only long above EMA50, only short below
  adx_min: 20             # Avoid choppy fakeout breakouts — require some trend momentum
  atr_period: 14
  sl_atr_multiplier: 2.0
  tp_atr_multiplier: 5.0  # Breakouts can run far

congress_mirror:
  lookback_days: 30
  min_transaction_value: 15000
  trend_confirmation_ema: 20
  max_age_hours: 72
  position_type: "long_only"
  exit_after_days: 30

# Global signal scoring
# score_threshold: composite weighted score required to enter.
# With weights ~1.0-1.2, a single strategy maxes out around 1.0-1.2.
# Threshold 1.2 = needs either ONE very confident signal OR TWO moderate signals agreeing.
signal_fusion:
  enabled: true
  score_weights:
    ema_crossover: 1.0
    rsi_mean_reversion: 1.0
    macd_momentum: 1.0
    bollinger_bounce: 1.0
    vwap_reversion: 1.0
    supertrend: 1.2        # Slightly higher weight — reliable trend indicator
    breakout_momentum: 1.1
    congress_mirror: 0.5
  score_threshold: 1.2
