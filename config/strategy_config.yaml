# ============================================================
# TradingBot — Strategy Parameters
# Adjust per asset class and timeframe after backtesting.
# ============================================================

ema_crossover:
  fast_ema: 9
  slow_ema: 21
  signal_ema: 5               # Optional 3-line confirmation
  volume_filter: false        # Disabled: crypto weekend volume unreliable
  volume_multiplier: 1.0
  atr_period: 14
  sl_atr_multiplier: 1.5      # Stop-loss = entry ± ATR × multiplier
  tp_atr_multiplier: 2.5      # Take-profit = entry ± ATR × multiplier
  trailing_stop: true
  trailing_stop_atr: 1.2
  confirmation_candles: 1     # Wait N closed candles before entry
  crossover_lookback: 3       # Also fire if crossover happened within last 3 bars

rsi_mean_reversion:
  rsi_period: 14
  oversold_threshold: 35      # Loosened from 30 → more frequent signals
  overbought_threshold: 65    # Loosened from 70 → more frequent signals
  extreme_oversold: 25
  extreme_overbought: 75
  ema_trend_filter: 0         # Disabled: trend filter removed for more signals
  atr_period: 14
  sl_atr_multiplier: 1.0
  tp_atr_multiplier: 2.0

macd_momentum:
  fast_period: 12
  slow_period: 26
  signal_period: 9
  histogram_threshold: 0.0    # Only trade when histogram crosses zero
  ema_trend_filter: 50        # Changed from EMA200 → EMA50 (realistic on 15Min)
  atr_period: 14
  sl_atr_multiplier: 1.5
  tp_atr_multiplier: 3.0
  min_histogram_magnitude: 0.0001  # Lowered to catch more crossovers

bollinger_bounce:
  atr_period: 14
  sl_atr_multiplier: 1.2
  tp_atr_multiplier: 2.0
  rsi_long_max: 50            # Only long when RSI < 50
  rsi_short_min: 50           # Only short when RSI > 50

vwap_reversion:
  vwap_deviation_pct: 0.3     # Price must deviate ≥ 0.3% from VWAP to qualify
  reentry_tolerance_pct: 0.1  # How close to VWAP the bar must close to trigger
  atr_period: 14
  sl_atr_multiplier: 1.0
  tp_atr_multiplier: 2.0
  rsi_long_max: 55            # Only long when RSI below this (not overbought)
  rsi_short_min: 45           # Only short when RSI above this (not oversold)

congress_mirror:
  lookback_days: 30           # How far back to look for trades
  min_transaction_value: 15000   # Min USD value to consider
  trend_confirmation_ema: 20  # Only mirror if price > EMA20 (uptrend)
  max_age_hours: 72           # Discard signals older than X hours
  position_type: "long_only"  # long_only | long_short
  exit_after_days: 30         # Auto-close position after N days

# Global signal scoring (multi-strategy agreement)
signal_fusion:
  enabled: true
  require_agreement: 1        # 1 strategy is enough if score is high
  score_weights:
    ema_crossover: 1.0
    rsi_mean_reversion: 1.0
    macd_momentum: 1.0
    bollinger_bounce: 1.0
    vwap_reversion: 1.0
    congress_mirror: 0.5
  score_threshold: 0.45       # Single strategy with score ≥ 0.45 trades
